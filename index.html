<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <div class="hero__content">
                <p class="hero__tag">Newsletter semanal</p>
                <h1>Receba novidades direto na sua caixa de entrada</h1>
                <p class="hero__text">
                    Cadastre-se para acompanhar ideias, lancamentos e conteudos selecionados com cuidado.
                </p>
            </div>

            <form class="signup-card" action="#" method="post" novalidate>
                <div class="field">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" placeholder="Digite seu nome" required>
                    <p class="field-message">Preencha seu nome para continuar.</p>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                    <p class="field-message">Digite um email valido.</p>
                </div>

                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                    <p class="field-message">Crie uma senha antes de se inscrever.</p>
                </div>

                <button type="submit" class="button">Inscrever-se</button>
            </form>
        </section>
    </main>

    <script>
        const form = document.querySelector(".signup-card");
        const fields = form.querySelectorAll(".field");

        function updateFieldState(field) {
            const input = field.querySelector("input");
            const isInvalid = !input.validity.valid;

            field.classList.toggle("field--error", isInvalid);
            input.setAttribute("aria-invalid", String(isInvalid));
        }

        form.addEventListener("submit", (event) => {
            let firstInvalidField = null;

            fields.forEach((field) => {
                updateFieldState(field);

                if (!firstInvalidField && field.classList.contains("field--error")) {
                    firstInvalidField = field;
                }
            });

            if (firstInvalidField) {
                event.preventDefault();
                firstInvalidField.querySelector("input").focus();
            }
        });

        fields.forEach((field) => {
            field.querySelector("input").addEventListener("input", () => updateFieldState(field));
        });
    </script>
</body>
</html>
